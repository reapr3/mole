<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mole Smash</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #dfeaee;
    --ink: #1f1a17;
    --grass: #5f9e3f;
    --soil: #3a2a22;
    --mound: #54392b;
    --hole: #120b08;
    --fur: #4a4955;
    --fur-light: #666572;
    --pink: #eaa0a8;
    --signal: #ff6a2b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sky: #151c20; --ink: #eee6dc; --grass: #4b7f31; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sky); color: var(--ink);
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px 32px;
  }
  main { width: min(100%, 440px); }

  header { margin-bottom: 18px; }
  h1 { margin: 0; font-size: clamp(2.4rem, 11vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 0.95; }
  header p { margin: 8px 0 0; font-size: 1rem; max-width: 30ch; }

  .hud { display: flex; gap: 28px; align-items: baseline; margin-bottom: 10px; }
  .hud div { font-size: 0.95rem; }
  .hud b { display: block; font-size: 2.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .hud .score b { color: var(--signal); }

  .clock { height: 6px; background: color-mix(in srgb, var(--ink) 15%, transparent); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .clock i { display: block; height: 100%; background: var(--signal); transform-origin: left; transition: transform 1s linear; }

  .ground {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px;
    padding: 28px 14px 10px; border-radius: 14px;
    background: linear-gradient(var(--grass) 0 16px, var(--soil) 16px);
  }
  .hole {
    position: relative; aspect-ratio: 1; padding: 0; border: 0;
    background: none; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .hole::before {
    content: ""; position: absolute; left: 4%; right: 4%; bottom: 6%; height: 26%;
    background: var(--hole); border-radius: 50%;
  }
  .hole::after {
    content: ""; position: absolute; left: -4%; right: -4%; bottom: -4%; height: 20%;
    background: var(--mound); border-top: 3px solid var(--grass);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0; z-index: 2;
  }
  .hole:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }

  .mole {
    position: absolute; left: 12%; bottom: 10%; width: 76%; z-index: 1;
    transform: translateY(105%); transition: transform 0.14s ease-out;
  }
  .mole svg { display: block; width: 100%; height: auto; }
  .hole.up .mole { transform: translateY(0); }
  .hole.hit .mole { transform: translateY(34%) scaleY(0.78); transition-duration: 0.08s; }
  .x { display: none; }
  .hole.hit .x { display: inline; }
  .hole.hit .o { display: none; }

  .controls { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  button.go {
    font: inherit; font-weight: 800; font-size: 1.05rem; color: #fff; background: var(--ink);
    border: 0; border-radius: 8px; padding: 12px 22px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button.go { color: #151c20; } }
  button.go:disabled { opacity: 0.35; cursor: default; }
  button.go:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
  #msg { margin: 0; font-size: 1rem; }
  @media (prefers-reduced-motion: reduce) { .mole, .clock i { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mole Smash</h1>
    <p>Mole Day is October 23, at 6:02. Celebrate by hitting things.</p>
  </header>

  <div class="hud">
    <div class="score"><b id="score">0</b>whacked</div>
    <div><b id="time">30</b>seconds left</div>
    <div><b id="best">0</b>best</div>
  </div>
  <div class="clock"><i id="bar"></i></div>

  <div class="ground" id="ground"></div>

  <div class="controls">
    <button class="go" id="start">Start</button>
    <p id="msg" aria-live="polite">Tap a mole when it pops up.</p>
  </div>
</main>

<script>
  const ROUND = 30;               // seconds per game
  const MOLE_SVG = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <ellipse cx="50" cy="72" rx="35" ry="32" fill="var(--fur)"/>
      <circle cx="50" cy="45" r="26" fill="var(--fur)"/>
      <ellipse cx="50" cy="54" rx="15" ry="11" fill="var(--fur-light)"/>
      <g fill="var(--pink)">
        <circle cx="50" cy="56" r="4.5"/>
        <circle cx="50" cy="50.5" r="2"/><circle cx="44.5" cy="52.5" r="2"/><circle cx="55.5" cy="52.5" r="2"/>
        <circle cx="44.5" cy="59.5" r="2"/><circle cx="55.5" cy="59.5" r="2"/><circle cx="50" cy="62" r="2"/>
        <ellipse cx="27" cy="84" rx="10" ry="6.5"/><ellipse cx="73" cy="84" rx="10" ry="6.5"/>
      </g>
      <g class="o" fill="#1f1a17"><circle cx="40" cy="40" r="2.3"/><circle cx="60" cy="40" r="2.3"/></g>
      <g class="x" stroke="#1f1a17" stroke-width="2.2" stroke-linecap="round">
        <path d="M37 37l6 6M43 37l-6 6M57 37l6 6M63 37l-6 6"/>
      </g>
    </svg>`;

  const ground = document.getElementById("ground");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const barEl = document.getElementById("bar");
  const msgEl = document.getElementById("msg");
  const startBtn = document.getElementById("start");

  const holes = [];
  let score = 0, timeLeft = ROUND, best = 0;
  let playing = false, lastHole = -1;
  let clock, moleTimer;

  try { best = Number(localStorage.getItem("moleBest")) || 0; } catch (e) {}
  bestEl.textContent = best;

  for (let i = 0; i < 9; i++) {
    const hole = document.createElement("button");
    hole.className = "hole";
    hole.setAttribute("aria-label", "Burrow " + (i + 1));
    hole.innerHTML = '<div class="mole">' + MOLE_SVG + '</div>';
    hole.addEventListener("pointerdown", () => whack(hole));
    ground.appendChild(hole);
    holes.push(hole);
  }

  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  function popUp() {
    if (!playing) return;
    let i;
    do { i = rand(0, 8); } while (i === lastHole);
    lastHole = i;
    const hole = holes[i];
    hole.classList.add("up");
    // Moles hang around for less time as the clock runs down
    const stay = 420 + (timeLeft / ROUND) * 480 + rand(0, 200);
    moleTimer = setTimeout(() => {
      hole.classList.remove("up", "hit");
      popUp();
    }, stay);
  }

  function whack(hole) {
    if (!playing || !hole.classList.contains("up") || hole.classList.contains("hit")) return;
    hole.classList.add("hit");
    scoreEl.textContent = ++score;
    setTimeout(() => hole.classList.remove("up", "hit"), 260);
  }

  function startGame() {
    score = 0; timeLeft = ROUND; playing = true; lastHole = -1;
    scoreEl.textContent = 0;
    timeEl.textContent = timeLeft;
    barEl.style.transform = "scaleX(1)";
    msgEl.textContent = "";
    startBtn.disabled = true;
    popUp();
    clock = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      barEl.style.transform = "scaleX(" + timeLeft / ROUND + ")";
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearInterval(clock);
    clearTimeout(moleTimer);
    holes.forEach(h => h.classList.remove("up", "hit"));
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("moleBest", best); } catch (e) {}
      msgEl.textContent = "New best: " + score + ".";
    } else {
      msgEl.textContent = "Time’s up. " + score + " whacked.";
    }
    startBtn.disabled = false;
    startBtn.textContent = "Play again";
  }

  startBtn.addEventListener("click", startGame);
</script>
</body>
</html>
